name: CD

on:
  push:
    branches:
      - main
      
  schedule:
    - cron: '30 16 * * *'   # Runs at 8:30 AM PST 

env:
  DBT_PROFILES_DIR: .
  DBT_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
  DBT_DATASET: ${{ secrets.PROD }}
  DBT_LOCATION: ${{ secrets.LOCATION }}

jobs:
  dbt-cd:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Generate profiles.yml
      run: |
        cat > profiles.yml << 'EOF'
        female_quo:
          target: prod
          outputs:
            dev:
              type: bigquery
              method: service-account
              project: PLACEHOLDER_PROJECT
              dataset: PLACEHOLDER_DEV_DATASET
              threads: 4
              keyfile: "PLACEHOLDER_KEYFILE"
              location: PLACEHOLDER_LOCATION
            prod:
              type: bigquery
              method: service-account
              project: PLACEHOLDER_PROJECT
              dataset: PLACEHOLDER_PROD_DATASET
              threads: 4
              keyfile: "PLACEHOLDER_KEYFILE"
              location: PLACEHOLDER_LOCATION
        EOF
        sed -i "s|PLACEHOLDER_PROJECT|${{ secrets.GCP_PROJECT_ID }}|g" profiles.yml
        sed -i "s|PLACEHOLDER_DEV_DATASET|${{ secrets.DEV }}|g" profiles.yml
        sed -i "s|PLACEHOLDER_PROD_DATASET|${{ secrets.PROD }}|g" profiles.yml
        sed -i "s|PLACEHOLDER_LOCATION|${{ secrets.LOCATION }}|g" profiles.yml
        sed -i "s|PLACEHOLDER_KEYFILE|${GOOGLE_APPLICATION_CREDENTIALS}|g" profiles.yml

    - name: Debug - verify profiles.yml
      run: |
        echo "Current directory:"
        pwd
        echo "Files in current directory:"
        ls -la
        echo "Contents of profiles.yml:"
        cat profiles.yml || echo "profiles.yml NOT FOUND"
        echo "GOOGLE_APPLICATION_CREDENTIALS value:"
        echo "$GOOGLE_APPLICATION_CREDENTIALS"

    - name: Run dbt commands
      run: |
        dbt debug --profiles-dir . --project-dir . --target prod
        dbt deps --profiles-dir . --project-dir .
        dbt build --profiles-dir . --project-dir . --target prod

    - name: Cleanup
      if: always()
      run: |
        rm -f ${GOOGLE_APPLICATION_CREDENTIALS}
        rm -f profiles.yml