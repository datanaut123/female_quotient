name: CI

on:
  pull_request:
    branches: [ main ]

env:
  DBT_PROFILES_DIR: .
  DBT_PROJECT: ${{ vars.GCP_PROJECT_ID }}
  DBT_DATASET: ${{ vars.DEV }}
  DBT_LOCATION: ${{ vars.LOCATION }}

jobs:
  dbt-ci:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Run sqlfmt
      run: |
        sqlfmt models/
  
    # - name: Run sqlfluff
    #   run: |
    #     sqlfluff lint models/
    #     sqlfluff fix models/ --force

    - name: Generate profiles.yml
      run: |
        cat > profiles.yml << 'EOF'
        female_quo:
          target: dev
          outputs:
            dev:
              type: bigquery
              method: service-account
              project: PLACEHOLDER_PROJECT
              dataset: PLACEHOLDER_DEV_DATASET
              threads: 4
              keyfile: "PLACEHOLDER_KEYFILE"
              location: PLACEHOLDER_LOCATION
            prod:
              type: bigquery
              method: service-account
              project: PLACEHOLDER_PROJECT
              dataset: PLACEHOLDER_PROD_DATASET
              threads: 4
              keyfile: "PLACEHOLDER_KEYFILE"
              location: PLACEHOLDER_LOCATION
        EOF
        sed -i "s|PLACEHOLDER_PROJECT|${{ vars.GCP_PROJECT_ID }}|g" profiles.yml
        sed -i "s|PLACEHOLDER_DEV_DATASET|${{ vars.DEV }}|g" profiles.yml
        sed -i "s|PLACEHOLDER_PROD_DATASET|${{ vars.PROD }}|g" profiles.yml
        sed -i "s|PLACEHOLDER_LOCATION|${{ vars.LOCATION }}|g" profiles.yml
        sed -i "s|PLACEHOLDER_KEYFILE|${GOOGLE_APPLICATION_CREDENTIALS}|g" profiles.yml

    - name: Debug - verify profiles.yml
      run: |
        echo "Current directory:"
        pwd
        echo "Files in current directory:"
        ls -la
        echo "Contents of profiles.yml:"
        cat profiles.yml || echo "profiles.yml NOT FOUND"
        echo "GOOGLE_APPLICATION_CREDENTIALS value:"
        echo "$GOOGLE_APPLICATION_CREDENTIALS"

    - name: Run dbt commands
      run: |
        dbt debug --profiles-dir . --project-dir . --target dev
        dbt deps --profiles-dir . --project-dir .
        dbt test --profiles-dir . --project-dir . --target dev
        dbt run --profiles-dir . --project-dir . --target dev

    - name: Cleanup
      if: always()
      run: |
        rm -f ${GOOGLE_APPLICATION_CREDENTIALS}
        rm -f profiles.yml